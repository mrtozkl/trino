name: Build Oracle Connector

on:
  push:
    branches:
      - master
      - main
      - oracle-stats-connector
    paths:
      - 'plugin/trino-oracle-stats/**'
      - 'plugin/trino-oracle/**'
      - 'plugin/trino-base-jdbc/**'
      - '.github/workflows/oracle-connector-build.yml'
  pull_request:
    paths:
      - 'plugin/trino-oracle-stats/**'
      - 'plugin/trino-oracle/**'
      - 'plugin/trino-base-jdbc/**'
      - '.github/workflows/oracle-connector-build.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  CONTINUOUS_INTEGRATION: true
  MAVEN_OPTS: "-Xmx3G -XX:+ExitOnOutOfMemoryError"
  MAVEN_ARGS: "--global-settings ${{ github.workspace }}/.mvn/settings-ci.xml"
  MVNW_REPOURL: "https://maven-central.storage-download.googleapis.com/maven2"

concurrency:
  group: oracle-connector-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-oracle-connector:
    name: Build & Test Trino Oracle Stats Connector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build Oracle Stats Connector and required dependencies
        run: |
          ./mvnw clean install \
            -pl :trino-oracle-stats -am \
            -B -V -T 1C \
            -DskipTests \
            -Dmaven.source.skip=true \
            -Dmaven.javadoc.skip=true \
            -Dair.check.skip-all=true \
            --no-transfer-progress

      - name: Run Oracle Stats Connector unit tests
        run: |
          ./mvnw test \
            -pl :trino-oracle-stats \
            -B \
            -Dmaven.source.skip=true \
            -Dmaven.javadoc.skip=true \
            -Dair.check.skip-all=true \
            -Dtest=TestOracleClient,TestOracleConfig,TestOracleStatsPlugin \
            --no-transfer-progress

      - name: Upload Oracle Stats Connector Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trino-oracle-stats-connector
          path: |
            plugin/trino-oracle-stats/target/trino-oracle-stats-*.zip
            plugin/trino-oracle-stats/target/trino-oracle-stats-*.jar
          if-no-files-found: error
